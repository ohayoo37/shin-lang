<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIN Content Studio</title><link rel="stylesheet" href="/_shin/admin.css"><script src="/_shin/admin.js" defer></script></head><body>
<header><a href="/">SHIN <span>Content Studio</span></a><button id="logout" type="button">ロック</button></header>
<main><section id="auth"><h1>コンテンツを、育てる。</h1><p>起動時に指定した管理トークンで編集を開始します。</p><form id="login"><label for="token">管理トークン</label><input id="token" type="password" autocomplete="off" required><button>編集を開始</button></form></section>
<p id="status" role="status" aria-live="polite"></p><section id="studio" hidden><div class="toolbar"><h1>Content Studio</h1><button id="new" type="button">新しい記事</button></div><div class="layout"><aside><label for="collection">コレクション</label><select id="collection"></select><div id="items"></div><button id="next" type="button" hidden>次の25件</button></aside>
<form id="editor"><div class="toolbar"><h2>記事の編集</h2><a href="/" target="_blank" rel="noopener">サイトを確認 ↗</a></div><label for="slug">URL名（半角英数字・ハイフン）</label><input id="slug" pattern="[a-z0-9][a-z0-9_-]{0,79}" required maxlength="80"><label for="title">タイトル</label><input id="title" required maxlength="200"><label for="body">本文（プレーンテキスト）</label><textarea id="body" rows="14"></textarea><label class="check"><input id="published" type="checkbox"> サイトに公開する</label><p class="hint">チェックを外して保存すると下書きになります。変更競合時は再読込が必要です。</p><button id="save">保存する</button><span id="revision"></span></form></div></section></main></body></html>
